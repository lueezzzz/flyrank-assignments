services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: tasks
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev
    ports:
      - "5432:5432" 
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tasks"]
      interval: 2s
      timeout: 3s
      retries: 10

  backend:
    build: 
      context: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app 
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgres://postgres:dev@db:5432/tasks
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: